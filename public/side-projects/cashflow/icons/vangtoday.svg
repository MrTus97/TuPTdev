<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFF8DC;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:0" />
    </linearGradient>
  </defs>
  <!-- Gold bar base -->
  <path d="M4 20 L8 8 L24 8 L28 20 L4 20 Z" fill="url(#goldGrad)" stroke="#B8860B" stroke-width="0.5"/>
  <!-- Gold bar front -->
  <path d="M4 20 L28 20 L28 26 L4 26 Z" fill="#DAA520" stroke="#B8860B" stroke-width="0.5"/>
  <!-- Gold bar right side -->
  <path d="M28 20 L24 8 L24 14 L28 26 Z" fill="#B8860B"/>
  <!-- Shine effect -->
  <path d="M6 18 L9 10 L14 10 L11 18 Z" fill="url(#goldShine)"/>
  <!-- Dollar sign -->
  <text x="16" y="19" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#8B4513" text-anchor="middle">$</text>
</svg>
