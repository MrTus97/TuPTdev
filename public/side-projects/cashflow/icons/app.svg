<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16B67F"/>
      <stop offset="1" stop-color="#0A8A5E"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD66B"/>
      <stop offset="1" stop-color="#F2B230"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- coin peeking out of the wallet -->
  <circle cx="300" cy="170" r="70" fill="url(#coin)"/>
  <circle cx="300" cy="170" r="52" fill="none" stroke="#D99A1E" stroke-width="8" opacity="0.55"/>
  <!-- note behind -->
  <rect x="132" y="150" width="190" height="110" rx="18" fill="#FFFFFF" opacity="0.55" transform="rotate(-10 227 205)"/>
  <!-- wallet body -->
  <rect x="104" y="212" width="304" height="200" rx="44" fill="#FFFFFF"/>
  <!-- clasp -->
  <path d="M408 272 h-86 a40 40 0 0 0 0 80 h86 z" fill="#DDF5EA"/>
  <circle cx="326" cy="312" r="14" fill="#0E9F6E"/>
</svg>
